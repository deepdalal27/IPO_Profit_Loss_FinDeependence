<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPO Deal Desk · FinDeependence</title>
<meta name="description" content="FinDeependence IPO Deal Desk by CA Deep Dalal: Kostak, Subject-to and premium IPO deals with investors and brokers, SEBI allotment probability, GMP, settlements and business analytics.">
<link rel="icon" href="logo_circle.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="brand"><img src="logo_circle.png" alt="FinDeependence logo"><div><div class="lbl">FinDeependence</div><h1>IPO Deal Desk</h1><span>IPO deals · investors · brokers · CA Deep Dalal</span></div></div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button data-v="dash" class="on">Dashboard</button>
      <button data-v="ipos">IPOs &amp; GMP</button>
      <button data-v="deals">Deals</button>
      <button data-v="calc">Calculator</button>
      <button data-v="predict">Predictor</button>
      <button data-v="reports">Reports</button>
      <button data-v="people">Investors &amp; Brokers</button>
      <button data-v="data">Data &amp; Settings</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="notices"></div>

  <section class="view" id="v-dash"></section>

  <section class="view" id="v-ipos" hidden>
    <div class="apply">
      <aside class="rail">
        <div class="rail-head"><h2>IPOs</h2>
          <select id="ipoFilter" aria-label="Which IPOs">
            <option value="recent">Live &amp; awaiting listing</option>
            <option value="live">Open &amp; upcoming</option>
            <option value="await">Awaiting listing</option>
            <option value="listed">Listed</option>
            <option value="all">All</option>
          </select></div>
        <input type="search" id="ipoSearch" placeholder="Search IPO" aria-label="Search IPO">
        <div class="ipo-list" id="ipoRail"></div>
        <button id="addIpoBtn">+ Add an IPO by hand</button>
        <p class="muted small" id="feedInfo"></p>
      </aside>
      <div class="panel" id="ipoPanel"></div>
    </div>
  </section>

  <section class="view" id="v-deals" hidden>
    <div class="apply">
      <aside class="rail">
        <div class="rail-head"><h2>Deals by IPO</h2>
          <select id="dealFilter" aria-label="Which IPOs">
            <option value="mine">Live &amp; applied</option>
            <option value="pending">Unsettled</option>
            <option value="all">All IPOs</option>
          </select></div>
        <input type="search" id="dealSearch" placeholder="Search IPO" aria-label="Search IPO">
        <div class="ipo-list" id="dealRail"></div>
        <p class="muted small" id="dealInfo"></p>
      </aside>
      <div class="panel" id="dealPanel"></div>
    </div>
  </section>

  <section class="view" id="v-calc" hidden></section>
  <section class="view" id="v-predict" hidden></section>
  <section class="view" id="v-reports" hidden></section>
  <section class="view" id="v-people" hidden></section>
  <section class="view" id="v-data" hidden></section>

  <p class="byline">FinDeependence · IPO Deal Desk · Created by CA Deep Dalal · Chartered Accountant · Fund Manager</p>
</main>

<div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"><div id="modalBody"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
<script src="js/parse.js"></script>
<script src="js/merge.js"></script>
<script src="js/calc.js"></script>
<script src="js/predict.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/ipos.js"></script>
<script src="js/deals.js"></script>
<script src="js/calculator.js"></script>
<script src="js/predictor.js"></script>
<script src="js/reports.js"></script>
<script src="js/people.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
