name: Build IPO history (subscription + GMP)
on:
  push:
    branches: [claude/youthful-bardeen-7axi46]
    paths: ['.github/workflows/probe.yml', 'scripts/history.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/history.js
        timeout-minutes: 60
      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/history.json
          git commit -m "Update IPO history" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
