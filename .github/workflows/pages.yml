name: Update IPOs & GMP and publish

on:
  push:
    branches: [main, claude/youthful-bardeen-7axi46]
  schedule:
    - cron: '11,41 3-16 * * *'   # every 30 min, 08:41–22:11 IST (GitHub may delay scheduled runs)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm test
      - name: Fetch IPOs, GMP and subscription (NSE, IPO Premium, investorgain)
        run: npm run sync
      - name: Save updated IPO list
        run: |
          if ! git diff --quiet -- site/ipos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/ipos.json
            git commit -m "Update IPO list and GMP"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push || echo "push skipped"
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
